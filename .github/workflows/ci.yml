name: CI Pipeline
permissions:
  id-token: write
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit

      - name: Run security scan
        run: bandit app.py 

      - name: Run tests
        run: pytest

      - name: Build Docker image
        run: docker build -t devsecops-flask-app .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'devsecops-flask-app:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::924748161167:role/GitHubActionsECRRole
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: devsecops-flask-app
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag devsecops-flask-app:latest $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag devsecops-flask-app:latest $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Push Docker image to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: devsecops-flask-app
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy to EC2 using SSM
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --region ap-south-1 \
            --instance-ids i-0190d1fde8398a423 \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 924748161167.dkr.ecr.ap-south-1.amazonaws.com",
              "docker pull 924748161167.dkr.ecr.ap-south-1.amazonaws.com/devsecops-flask-app:latest",
              "docker stop devsecops-container || true",
              "docker rm devsecops-container || true",
              "docker run -d --name devsecops-container -p 5000:5000 924748161167.dkr.ecr.ap-south-1.amazonaws.com/devsecops-flask-app:latest"
            ]' \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --region ap-south-1 \
            --command-id "$COMMAND_ID" \
            --instance-id i-0190d1fde8398a423

          echo "EC2 deployment completed successfully."